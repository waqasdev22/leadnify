<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Warm up the connections the public property page needs (hub JSON + hero image) so they start
         faster — helps the heading/banner appear sooner. -->
    <link rel="preconnect" href="https://cre-dashboard-ba596-default-rtdb.firebaseio.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <title>Leadnify.io — Dashboard</title>
    <!-- Match the first-paint background to what will render, so a reload shows no white flash:
         dark (hero) for a property page, light for the dashboard / listings. -->
    <style>html,body{margin:0}</style>
    <script>
      try {
        var p = location.pathname.replace(/^\/+|\/+$/g, '');
        var isProperty = p && p.indexOf('.') === -1; // any clean path segment = a property page
        document.documentElement.style.background = isProperty ? '#0f172a' : '#f8fafc';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
